<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotTech | Authentication</title>
    
    <!-- Next-Gen Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@200;400;600;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#109B74',
                            teal: '#1B8A98',
                            blue: '#257EA6',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        arabic: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #fafafa; color: #0a0a0a; overflow-x: hidden; }
        .text-gradient { background: linear-gradient(135deg, #109B74 0%, #257EA6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .auth-container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }

        .input-field {
            width: 100%; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 0.75rem 1rem;
            font-family: 'Inter', sans-serif; transition: all 0.3s ease; background: #ffffff;
        }
        .input-field:focus { outline: none; border-color: #109B74; box-shadow: 0 0 0 2px rgba(16, 155, 116, 0.1); }

        #canvas-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.4; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="canvas-bg"></div>

    <div class="auth-container w-full max-w-4xl rounded-3xl overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Left Side: Branding -->
        <div class="md:w-1/2 p-12 flex flex-col justify-between relative overflow-hidden bg-gray-900 text-white">
            <div class="absolute inset-0 bg-gradient-to-br from-brand-green/20 to-brand-blue/20"></div>
            
            <a href="index.html" class="relative z-10 block w-fit hover:scale-105 transition-transform">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>

            <div class="relative z-10 mt-12 mb-8">
                <img src="./logo2.png" alt="DotTech" class="h-10 mb-8 filter brightness-0 invert" onerror="this.style.display='none'">
                <h1 class="font-display text-4xl md:text-5xl font-bold leading-tight mb-4">Join the Future.</h1>
                <p class="font-sans text-gray-300 font-light">Create an account to track orders, save preferences, and access premium tech consulting.</p>
            </div>
        </div>

        <!-- Right Side: Forms -->
        <div class="md:w-1/2 p-8 md:p-12 relative bg-white">
            
            <!-- Auth Toggle -->
            <div class="flex gap-6 border-b border-gray-100 mb-8 pb-4">
                <button onclick="toggleView('login')" id="tab-login" class="font-display font-semibold text-xl text-gray-900 transition-colors">Sign In</button>
                <button onclick="toggleView('register')" id="tab-register" class="font-display font-semibold text-xl text-gray-400 hover:text-gray-900 transition-colors">Register</button>
            </div>

            <div id="error-msg" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg font-sans"></div>

            <!-- Login View -->
            <div id="view-login" class="block">
                <input type="email" id="log-email" placeholder="Email Address" class="input-field mb-4">
                <input type="password" id="log-password" placeholder="Password" class="input-field mb-2">
                
                <div class="text-right mb-6">
                    <button onclick="window.authAPI.resetPassword()" class="text-sm text-brand-teal hover:underline font-medium">Forgot Password?</button>
                </div>
                
                <button onclick="window.authAPI.emailSignIn()" class="w-full bg-gray-900 text-white font-sans font-semibold py-3.5 rounded-xl hover:bg-brand-green transition-colors shadow-lg mb-4">
                    Sign In
                </button>
            </div>

            <!-- Register View -->
            <div id="view-register" class="hidden">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <input type="text" id="reg-fname" placeholder="First Name" class="input-field col-span-1">
                    <input type="text" id="reg-lname" placeholder="Last Name" class="input-field col-span-1">
                    <input type="tel" id="reg-phone" placeholder="Phone Number" class="input-field col-span-2">
                </div>
                <input type="email" id="reg-email" placeholder="Email Address" class="input-field mb-4">
                <input type="password" id="reg-password" placeholder="Create Password" class="input-field mb-6">
                
                <button onclick="window.authAPI.emailSignUp()" class="w-full bg-brand-green text-white font-sans font-semibold py-3.5 rounded-xl hover:bg-[#0e8563] transition-colors shadow-lg shadow-brand-green/20 mb-4">
                    Create Account
                </button>
            </div>

            <!-- Social Login -->
            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-gray-100"></div>
                <span class="text-xs text-gray-400 uppercase font-bold tracking-widest">Or</span>
                <div class="flex-1 h-px bg-gray-100"></div>
            </div>

            <button onclick="window.authAPI.googleSignIn()" class="w-full flex items-center justify-center gap-3 border border-gray-200 rounded-xl py-3 hover:bg-gray-50 transition-colors font-medium text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV7G2oYqi5D2D94AkaWXUFQ3zEIgsg40s",
            authDomain: "dottech-website.firebaseapp.com",
            projectId: "dottech-website",
            storageBucket: "dottech-website.firebasestorage.app",
            messagingSenderId: "1081481170332",
            appId: "1:1081481170332:web:189c741dd1b21250b48c59",
            measurementId: "G-FL0H9KDFJ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'dottech-store';

        window.showError = (error) => {
            const errEl = document.getElementById('error-msg');
            errEl.textContent = error.message ? error.message.replace('Firebase: ', '') : error;
            errEl.classList.remove('hidden');
            setTimeout(() => errEl.classList.add('hidden'), 5000);
        };

        const saveExtraInfo = async (user, fName, lName, phone) => {
            try {
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'info'), {
                    firstName: fName,
                    lastName: lName,
                    phoneNumber: phone,
                    email: user.email,
                    createdAt: new Date()
                }, { merge: true });
                await updateProfile(user, { displayName: fName + ' ' + lName });
            } catch (e) {
                console.error("Error saving profile info", e);
            }
        };

        window.authAPI = {
            googleSignIn: () => {
                signInWithPopup(auth, provider).then(() => {
                    window.location.href = 'index.html';
                }).catch(window.showError);
            },
            emailSignUp: () => {
                const f = document.getElementById('reg-fname').value;
                const l = document.getElementById('reg-lname').value;
                const p = document.getElementById('reg-phone').value;
                const e = document.getElementById('reg-email').value;
                const pw = document.getElementById('reg-password').value;
                if(!f || !l || !p || !e || !pw) return window.showError("Please fill in all fields.");
                
                createUserWithEmailAndPassword(auth, e, pw).then(async (cred) => {
                    await saveExtraInfo(cred.user, f, l, p);
                    window.location.href = 'index.html';
                }).catch(window.showError);
            },
            emailSignIn: () => {
                const e = document.getElementById('log-email').value;
                const p = document.getElementById('log-password').value;
                if(!e || !p) return window.showError("Please enter email and password.");
                
                signInWithEmailAndPassword(auth, e, p).then(() => {
                    window.location.href = 'index.html';
                }).catch(window.showError);
            },
            resetPassword: () => {
                const e = document.getElementById('log-email').value;
                if(!e) return window.showError("Please enter your email in the Email Address field to reset.");
                sendPasswordResetEmail(auth, e).then(() => {
                    window.showError({message: "Password reset link sent to your email!"});
                }).catch(window.showError);
            }
        };
    </script>

    <!-- UI Logic -->
    <script>
        function toggleView(view) {
            document.getElementById('error-msg').classList.add('hidden');
            if(view === 'login') {
                document.getElementById('view-login').style.display = 'block';
                document.getElementById('view-register').style.display = 'none';
                document.getElementById('tab-login').classList.replace('text-gray-400', 'text-gray-900');
                document.getElementById('tab-register').classList.replace('text-gray-900', 'text-gray-400');
            } else {
                document.getElementById('view-login').style.display = 'none';
                document.getElementById('view-register').style.display = 'block';
                document.getElementById('tab-register').classList.replace('text-gray-400', 'text-gray-900');
                document.getElementById('tab-login').classList.replace('text-gray-900', 'text-gray-400');
            }
        }
    </script>
</body>
</html>

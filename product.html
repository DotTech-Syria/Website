<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotTech | Product Details</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@200;400;600;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: { green: '#109B74', teal: '#1B8A98', blue: '#257EA6' } }, fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'], arabic: ['Tajawal', 'sans-serif'] } }
            }
        }
    </script>

    <style>
        body { background-color: #fafafa; color: #0a0a0a; overflow-x: hidden; }
        html[dir="rtl"] body { font-family: 'Tajawal', sans-serif !important; }
        .glass-nav { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 0, 0, 0.04); }
        .bento-card { background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.06); border-radius: 1.5rem; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); }
        .star-rating svg { cursor: pointer; transition: transform 0.2s; }
        .star-rating svg:hover { transform: scale(1.2); }
        .star-rating svg.active { fill: #f59e0b; color: #f59e0b; }
    </style>
</head>
<body class="min-h-screen pt-24 pb-12">

    <nav class="fixed w-full top-0 z-50 glass-nav transition-all duration-300">
        <div class="max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="store.html" class="flex items-center gap-2 text-gray-500 hover:text-gray-900 transition-colors font-medium">
                <svg class="w-5 h-5 rtl:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Back to Store
            </a>
            <div class="flex items-center gap-3">
                <span id="nav-currency" class="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">USD</span>
                <button onclick="window.authAPI.logout()" class="text-sm font-medium text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-full transition-colors hidden" id="logout-btn">Sign Out</button>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-xl mx-auto px-6 grid md:grid-cols-2 gap-12 lg:gap-20 mb-20">
        
        <!-- Left: Image -->
        <div class="bento-card p-8 flex items-center justify-center bg-gray-50 aspect-square relative">
            <div id="p-sale" class="hidden absolute top-6 start-6 bg-red-500 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg z-10 uppercase tracking-widest animate-pulse">Sale</div>
            <button id="p-wish" onclick="toggleProdWishlist()" class="absolute top-6 end-6 z-20 bg-white/80 backdrop-blur p-3 rounded-full shadow-md hover:shadow-lg transition-all">
                <svg class="w-6 h-6 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
            <img id="p-img" src="" class="w-full h-full object-contain mix-blend-multiply" alt="Product Image">
        </div>

        <!-- Right: Info -->
        <div class="flex flex-col justify-center">
            <div id="p-brand" class="text-brand-green font-bold uppercase tracking-widest text-sm mb-2 hidden"></div>
            <h1 id="p-name" class="font-display text-4xl md:text-5xl font-bold text-gray-900 mb-4 leading-tight">Loading...</h1>
            
            <div class="flex items-center gap-4 mb-6">
                <div class="flex text-amber-400 text-sm">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    <span id="p-rating-avg" class="ms-1 font-medium text-gray-700">New</span>
                </div>
                <div class="h-4 w-px bg-gray-300"></div>
                <span class="text-sm text-gray-500" id="p-cat"></span>
            </div>

            <div class="flex items-end gap-3 mb-8">
                <span id="p-price" class="font-display text-4xl font-bold text-gray-900"></span>
                <span id="p-old-price" class="text-xl text-gray-400 line-through mb-1 hidden"></span>
            </div>

            <p id="p-desc" class="text-gray-600 leading-relaxed mb-8 font-sans"></p>

            <div class="grid grid-cols-2 gap-4 mb-10 border-t border-b border-gray-100 py-6">
                <div><span class="block text-xs text-gray-400 uppercase font-bold mb-1">Color</span><span id="p-color" class="font-medium text-gray-900">N/A</span></div>
                <div><span class="block text-xs text-gray-400 uppercase font-bold mb-1">Barcode</span><span id="p-barcode" class="font-medium text-gray-900 font-mono">N/A</span></div>
            </div>

            <button id="btn-add-cart" class="w-full bg-gray-900 hover:bg-brand-green text-white font-bold py-4 rounded-xl transition-colors shadow-lg flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                Add to Cart
            </button>
        </div>
    </div>

    <div class="max-w-screen-md mx-auto px-6">
        <h3 class="font-display text-3xl font-bold mb-8 text-center">Customer Reviews</h3>
        
        <!-- Add Review Form (Hidden if not logged in) -->
        <div id="review-form-container" class="bento-card p-6 mb-10 hidden">
            <h4 class="font-bold text-gray-900 mb-4">Write a Review</h4>
            <div class="flex items-center gap-2 mb-4 star-rating" id="star-selector">
                <svg data-val="1" class="w-8 h-8 text-gray-300 hover:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <svg data-val="2" class="w-8 h-8 text-gray-300 hover:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <svg data-val="3" class="w-8 h-8 text-gray-300 hover:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <svg data-val="4" class="w-8 h-8 text-gray-300 hover:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <svg data-val="5" class="w-8 h-8 text-gray-300 hover:text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
            </div>
            <textarea id="review-text" rows="3" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-brand-green mb-4" placeholder="Share your thoughts about this product..."></textarea>
            <button onclick="submitReview()" class="bg-brand-green text-white font-bold py-2 px-6 rounded-lg hover:opacity-90">Submit Review</button>
        </div>

        <div id="auth-prompt" class="text-center py-6 bg-gray-50 rounded-xl mb-10 border border-gray-100">
            <p class="text-gray-500 mb-2">Please sign in to write a review.</p>
            <a href="auth.html" class="text-brand-green font-bold hover:underline">Sign In</a>
        </div>

        <!-- Reviews List -->
        <div id="reviews-list" class="space-y-4">
            <div class="text-center text-gray-400 py-10">Loading reviews...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCV7G2oYqi5D2D94AkaWXUFQ3zEIgsg40s", authDomain: "dottech-website.firebaseapp.com", projectId: "dottech-website", storageBucket: "dottech-website.firebasestorage.app", messagingSenderId: "1081481170332", appId: "1:1081481170332:web:189c741dd1b21250b48c59" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'dottech-store';

        // Get Product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentProductId = urlParams.get('id');

                let currentProductData = null;
        let selectedRating = 0;
        let currentLang = localStorage.getItem('dottech_lang') || 'en';
        let currentCurrency = localStorage.getItem('dottech_currency') || 'USD';
        window.exchangeRate = 15000;

        // Fetch Global Settings (Exchange Rate)
        getDoc(doc(db, 'artifacts', appId, 'settings', 'global')).then(snap => {
            if(snap.exists() && snap.data().exchangeRate) {
                window.exchangeRate = snap.data().exchangeRate;
                if(currentCurrency === 'SYP' && currentProductData) {
                    document.getElementById('p-price').innerText = formatPrice(currentProductData.baseUsdPriceStr);
                    if(currentProductData.baseUsdOldPriceStr) {
                        document.getElementById('p-old-price').innerText = formatPrice(currentProductData.baseUsdOldPriceStr);
                    }
                }
            }
        });

        document.documentElement.lang = currentLang; document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        document.getElementById('nav-currency').innerText = currentCurrency;

        function formatPrice(usdPriceStr) {
            if(!usdPriceStr) return '';
            const usdNum = parseFloat(usdPriceStr.replace(/[^0-9.-]+/g,""));
            if(isNaN(usdNum)) return usdPriceStr;
            return currentCurrency === 'SYP' ? (usdNum * window.exchangeRate).toLocaleString() + ' ل.س' : '$' + usdNum.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
        
        /* --- CSV Parser & Fetch --- */
        function parseCSV(str) {
            const arr = []; let quote = false; let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        async function loadProduct() {
            if(!currentProductId) { document.body.innerHTML = "<h1 class='text-center mt-20 text-xl'>Product Not Found</h1>"; return; }
            
            try {
                const res = await fetch("https://docs.google.com/spreadsheets/d/1onrTRPtJVMCVRTRI0zVm5lv_ra1PCZAnXHLpjFslMQs/export?format=csv");
                const txt = await res.text(); const rows = parseCSV(txt).slice(1);
                
                const productRow = rows.find((_, i) => 'p' + i === currentProductId);
                if(!productRow) throw new Error("Product not in sheet");

                currentProductData = {
                    id: currentProductId, img: productRow[0], name: productRow[1], desc: productRow[2],
                    baseUsdPriceStr: productRow[3] || '0', priceNum: parseFloat((productRow[3]||'0').replace(/[^0-9.-]+/g,"")) || 0,
                    baseUsdOldPriceStr: productRow[4] || '', color: productRow[6] || 'N/A',
                    barcode: productRow[7] || 'N/A', category: productRow[8] || '',
                    subCat: productRow[9] || '', company: productRow[10] || ''
                };

                // Populate UI
                document.getElementById('p-img').src = currentProductData.img;
                document.getElementById('p-name').innerText = currentProductData.name;
                document.getElementById('p-desc').innerText = currentProductData.desc;
                document.getElementById('p-color').innerText = currentProductData.color;
                document.getElementById('p-barcode').innerText = currentProductData.barcode;
                document.getElementById('p-cat').innerText = `${currentProductData.category} > ${currentProductData.subCat}`;
                
                if(currentProductData.company) {
                    const b = document.getElementById('p-brand'); b.innerText = currentProductData.company; b.classList.remove('hidden');
                }

                document.getElementById('p-price').innerText = formatPrice(currentProductData.baseUsdPriceStr);
                if(currentProductData.baseUsdOldPriceStr) {
                    const op = document.getElementById('p-old-price'); op.innerText = formatPrice(currentProductData.baseUsdOldPriceStr); op.classList.remove('hidden');
                    document.getElementById('p-sale').classList.remove('hidden');
                }

                document.getElementById('btn-add-cart').onclick = async () => {
                    if(!auth.currentUser) { alert("Please sign in to add to cart."); window.location.href="auth.html"; return; }
                    const cartRef = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'cart', 'data');
                    const cSnap = await getDoc(cartRef); let cList = cSnap.exists() ? (cSnap.data().items || []) : [];
                    const existing = cList.find(i => i.id === currentProductData.id);
                    if (existing) existing.qty += 1; else cList.push({ id: currentProductData.id, name: currentProductData.name, priceNum: currentProductData.priceNum, img: currentProductData.img, qty: 1 });
                    await setDoc(cartRef, { items: cList });
                    alert("Added to cart!");
                };

                loadReviews();

            } catch(e) { document.getElementById('p-name').innerText = "Failed to load product data."; }
        }

        /* --- Reviews & Wishlist Logic --- */
        async function loadReviews() {
            const list = document.getElementById('reviews-list');
            try {
                const q = query(collection(db, 'artifacts', appId, 'products', currentProductId, 'reviews'), orderBy('date', 'desc'));
                const snaps = await getDocs(q);
                if(snaps.empty) { list.innerHTML = '<div class="text-center text-gray-500 py-10">No reviews yet. Be the first!</div>'; return; }
                
                let html = ''; let totalStars = 0; let count = 0;
                snaps.forEach(doc => {
                    const d = doc.data(); totalStars += d.rating; count++;
                    const stars = Array(5).fill(0).map((_, i) => `<svg class="w-4 h-4 ${i < d.rating ? 'text-amber-400 fill-amber-400' : 'text-gray-300 fill-current'}" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`).join('');
                    html += `<div class="bento-card p-5"><div class="flex items-center gap-3 mb-2"><div class="w-8 h-8 bg-brand-green/20 rounded-full flex items-center justify-center text-brand-green font-bold">${d.userName.charAt(0)}</div><div><p class="font-bold text-sm text-gray-900">${d.userName}</p><div class="flex">${stars}</div></div></div><p class="text-gray-600 text-sm">${d.text}</p></div>`;
                });
                list.innerHTML = html;
                document.getElementById('p-rating-avg').innerText = (totalStars / count).toFixed(1) + ' Stars';
            } catch(e) { list.innerHTML = '<div class="text-red-500 text-center">Failed to load reviews.</div>'; }
        }

        window.submitReview = async function() {
            if(selectedRating === 0) return alert("Please select a star rating.");
            const txt = document.getElementById('review-text').value;
            if(!txt) return alert("Please write a review.");
            
            try {
                const uDoc = await getDoc(doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'profile', 'info'));
                const uName = uDoc.exists() ? uDoc.data().firstName : auth.currentUser.email.split('@')[0];
                
                await addDoc(collection(db, 'artifacts', appId, 'products', currentProductId, 'reviews'), {
                    userId: auth.currentUser.uid, userName: uName, rating: selectedRating, text: txt, date: new Date().toISOString()
                });
                document.getElementById('review-text').value = ''; selectedRating = 0; updateStarsUI(); loadReviews();
            } catch(e) { alert("Failed to submit review."); }
        }

        window.toggleProdWishlist = async function() {
            if(!auth.currentUser) return alert("Please sign in to add to wishlist.");
            const wBtn = document.getElementById('p-wish');
            wBtn.innerHTML = `<div class="w-5 h-5 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div>`;
            
            const ref = doc(db, 'artifacts', appId, 'users', auth.currentUser.uid, 'wishlist', 'data');
            const docSnap = await getDoc(ref); let wList = docSnap.exists() ? (docSnap.data().items || []) : [];
            
            const idx = wList.indexOf(currentProductId);
            let isAdded = false;
            if(idx > -1) wList.splice(idx, 1); else { wList.push(currentProductId); isAdded = true; }
            await setDoc(ref, { items: wList });
            updateWishlistIcon(isAdded);
        }

        function updateWishlistIcon(isAdded) {
            const wBtn = document.getElementById('p-wish');
            if(isAdded) { wBtn.innerHTML = `<svg class="w-6 h-6 text-red-500 fill-red-500" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>`; }
            else { wBtn.innerHTML = `<svg class="w-6 h-6 text-gray-400 hover:text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>`; }
        }

        // Auth Setup
        window.authAPI = { logout: () => signOut(auth).then(() => window.location.href="store.html") };

        onAuthStateChanged(auth, async (user) => {
            if(user) {
                document.getElementById('auth-prompt').classList.add('hidden');
                document.getElementById('review-form-container').classList.remove('hidden');
                document.getElementById('logout-btn').classList.remove('hidden');
                
                // Check if in wishlist
                if(currentProductId) {
                    const wSnap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'wishlist', 'data'));
                    const isAdded = wSnap.exists() && (wSnap.data().items || []).includes(currentProductId);
                    updateWishlistIcon(isAdded);
                }
            } else {
                document.getElementById('auth-prompt').classList.remove('hidden');
                document.getElementById('review-form-container').classList.add('hidden');
            }
        });

        // Star Rating UI Setup
        const stars = document.querySelectorAll('#star-selector svg');
        function updateStarsUI() {
            stars.forEach(s => {
                if(parseInt(s.dataset.val) <= selectedRating) { s.classList.add('active', 'fill-amber-400'); s.classList.remove('text-gray-300'); }
                else { s.classList.remove('active', 'fill-amber-400'); s.classList.add('text-gray-300'); }
            });
        }
        stars.forEach(star => {
            star.addEventListener('click', (e) => { selectedRating = parseInt(e.currentTarget.dataset.val); updateStarsUI(); });
        });

        loadProduct();
    </script>
</body>

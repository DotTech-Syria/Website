<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotTech | Store</title>
    
    <!-- Next-Gen Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@200;400;600;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { green: '#109B74', teal: '#1B8A98', blue: '#257EA6' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'], arabic: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        :root { --bg-color: #f8fafc; --text-main: #0a0a0a; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        html[dir="rtl"] body, html[dir="rtl"] .font-display, html[dir="rtl"] .font-sans { font-family: 'Tajawal', sans-serif !important; }
        ::selection { background-color: rgba(16, 155, 116, 0.2); color: #109B74; }
        .text-gradient { background: linear-gradient(135deg, #109B74 0%, #257EA6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.5; }

        .product-card { background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02); transition: all 0.4s ease; display: flex; flex-direction: column; height: 100%; }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 25px 50px -12px rgba(16, 155, 116, 0.15); border-color: rgba(16, 155, 116, 0.3); }
        .img-wrapper { overflow: hidden; border-radius: 0.75rem; background: #f1f5f9; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
        .img-wrapper img { transition: transform 0.6s ease; max-height: 100%; max-width: 100%; object-fit: contain; mix-blend-mode: multiply; }
        .product-card:hover .img-wrapper img { transform: scale(1.1); }

        #cart-drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .cart-open { transform: translateX(0) !important; }
        #toast-notification { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(100px); opacity: 0; }
        #toast-notification.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <nav class="fixed w-full top-0 z-50 glass-nav transition-all duration-300">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 py-5 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="./logo.png" alt="DotTech Logo" class="h-7 object-contain transition-transform group-hover:scale-105" onerror="this.outerHTML='<span class=\'font-display font-bold text-2xl tracking-tighter text-gradient\'>DotTech.</span>'">
            </a>
            
            <div class="hidden lg:flex items-center gap-8 font-sans text-sm font-medium tracking-wide">
                <a href="index.html" class="text-gray-900 hover:text-brand-green transition-colors" data-i18n="nav_home">Home</a>
                <a href="#products-grid" class="text-brand-green font-bold transition-colors" data-i18n="nav_store">Store</a>
            </div>

            <div class="flex items-center gap-5">
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="font-sans text-xs font-bold tracking-widest uppercase text-gray-500 hover:text-brand-green transition-colors">AR</button>
                <div class="w-px h-5 bg-gray-300 mx-2"></div>
                <button onclick="toggleCart()" class="relative text-gray-900 hover:text-brand-green transition-colors group">
                    <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span id="cart-badge" class="absolute -top-1.5 -right-2 bg-brand-green text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">0</span>
                </button>
                <div class="relative pl-2" id="auth-wrapper">
                    <button id="auth-login-btn" onclick="window.location.href='auth.html'" class="text-gray-900 hover:text-brand-green transition-all hover:scale-110 flex items-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </button>
                    <div id="user-profile-menu" class="hidden items-center cursor-pointer group" onclick="toggleUserDropdown()">
                        <img id="user-avatar" src="" class="w-7 h-7 rounded-full border border-gray-200 object-cover" alt="User">
                        <div id="user-dropdown" class="absolute top-10 ltr:right-0 rtl:left-0 bg-white border border-gray-100 rounded-xl shadow-xl py-2 w-48 hidden opacity-0 transition-opacity">
                            <button onclick="window.authAPI.logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">Sign Out</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="pt-32 pb-16 relative">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 text-center reveal">
            <h1 class="font-display text-5xl md:text-7xl font-semibold tracking-tighter text-gray-900 mb-6" data-i18n="store_hero_title">Hardware & Gear.</h1>
            <p class="font-sans text-xl text-gray-500 max-w-2xl mx-auto" data-i18n="store_hero_desc">Explore our curated collection of premium components, peripherals, and smart accessories.</p>
        </div>
    </section>

    <section id="products-grid" class="py-12 min-h-screen relative z-10">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12">
            <!-- Dynamic Products Container -->
            <div id="store-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 lg:gap-8">
                <div class="col-span-full text-center py-20">
                    <div class="inline-block w-8 h-8 border-4 border-gray-200 border-t-brand-green rounded-full animate-spin mb-4"></div>
                    <p class="text-gray-500 font-sans" data-i18n="loading_store">Loading inventory from Google Sheets...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white pt-16 pb-8 border-t border-gray-100 relative z-10">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2">
                <img src="./logo.png" alt="DotTech" class="h-5 object-contain grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition-all" onerror="this.style.display='none'">
                <span class="font-display font-semibold text-gray-900 tracking-tight">DotTech.</span>
            </div>
            <div class="font-sans text-sm text-gray-400" data-i18n="footer_rights">© 2026 DotTech. All rights reserved.</div>
        </div>
    </footer>

    <!-- Cart Drawer -->
    <div id="cart-drawer" class="fixed top-0 bottom-0 ltr:right-0 rtl:left-0 w-full md:w-[400px] bg-white/95 backdrop-blur-xl shadow-2xl z-[100] transform ltr:translate-x-full rtl:-translate-x-full border-l border-gray-100 flex flex-col">
        <div class="p-6 flex items-center justify-between border-b border-gray-100">
            <h2 class="font-display text-2xl font-semibold">Your Cart</h2>
            <button onclick="toggleCart()" class="p-2 hover:bg-gray-100 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            <div id="empty-cart-msg" class="text-center text-gray-500 font-sans mt-10">Your cart is currently empty.</div>
        </div>
        <div class="p-6 border-t border-gray-100 bg-gray-50/50">
            <div class="flex justify-between items-center mb-6">
                <span class="font-sans text-gray-500">Total:</span>
                <span id="cart-total-price" class="font-display text-2xl font-semibold">$0.00</span>
            </div>
            <button class="w-full bg-brand-green text-white font-sans font-semibold py-4 rounded-xl hover:bg-[#0e8563] transition-colors shadow-lg shadow-brand-green/20">Checkout</button>
        </div>
    </div>
    <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Toast -->
    <div id="toast-notification" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[110] bg-gray-900 text-white px-6 py-3 rounded-full font-sans text-sm flex items-center gap-3 shadow-2xl">
        <svg class="w-4 h-4 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Item added to cart</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCV7G2oYqi5D2D94AkaWXUFQ3zEIgsg40s",
            authDomain: "dottech-website.firebaseapp.com",
            projectId: "dottech-website",
            storageBucket: "dottech-website.firebasestorage.app",
            messagingSenderId: "1081481170332",
            appId: "1:1081481170332:web:189c741dd1b21250b48c59",
            measurementId: "G-FL0H9KDFJ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.authAPI = {
            logout: () => {
                signOut(auth).then(() => {
                    document.getElementById('user-dropdown').style.opacity = '0';
                    setTimeout(() => document.getElementById('user-dropdown').classList.add('hidden'), 200);
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('auth-login-btn');
            const profileMenu = document.getElementById('user-profile-menu');
            const avatar = document.getElementById('user-avatar');

            if (user) {
                loginBtn.classList.add('hidden');
                profileMenu.classList.remove('hidden');
                profileMenu.classList.add('flex');
                avatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${user.email}&background=109B74&color=fff`;
            } else {
                loginBtn.classList.remove('hidden');
                profileMenu.classList.add('hidden');
                profileMenu.classList.remove('flex');
            }
        });
    </script>

    <script>
        /* --- i18n --- */
        const translations = {
            en: { nav_home: "Home", nav_store: "Store", store_hero_title: "Hardware & Gear.", store_hero_desc: "Explore our curated collection of premium components, peripherals, and smart accessories.", btn_cart: "Add to Cart", footer_rights: "© 2026 DotTech. All rights reserved.", loading_store: "Loading inventory..." },
            ar: { nav_home: "الرئيسية", nav_store: "المتجر", store_hero_title: "العتاد والملحقات.", store_hero_desc: "استكشف مجموعتنا المختارة من المكونات الممتازة والملحقات الذكية.", btn_cart: "أضف للسلة", footer_rights: "© ٢٠٢٦ دوت تك. جميع الحقوق محفوظة.", loading_store: "جاري تحميل المنتجات..." }
        };

        let currentLang = localStorage.getItem('dottech_lang') || 'en';
        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            const btn = document.getElementById('lang-toggle-btn');
            if (btn) btn.textContent = lang === 'en' ? 'AR' : 'EN';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) el.innerHTML = translations[lang][key];
            });
            renderCart();
        }
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            localStorage.setItem('dottech_lang', currentLang);
            applyLanguage(currentLang);
            fetchProducts();
        }
        document.addEventListener("DOMContentLoaded", () => { applyLanguage(currentLang); fetchProducts(); reveal(); });

        function reveal() {
            var reveals = document.querySelectorAll(".reveal");
            for (var i = 0; i < reveals.length; i++) {
                if (reveals[i].getBoundingClientRect().top < window.innerHeight - 50) reveals[i].classList.add("active");
            }
        }
        window.addEventListener("scroll", reveal);

        function toggleUserDropdown() {
            const dropdown = document.getElementById('user-dropdown');
            if (dropdown.classList.contains('hidden')) { dropdown.classList.remove('hidden'); setTimeout(() => dropdown.style.opacity = '1', 10); }
            else { dropdown.style.opacity = '0'; setTimeout(() => dropdown.classList.add('hidden'), 200); }
        }

        /* --- Fetch Data --- */
        async function fetchProducts() {
            const container = document.getElementById('store-container');
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/1onrTRPtJVMCVRTRI0zVm5lv_ra1PCZAnXHLpjFslMQs/gviz/tq?tqx=out:json`);
                const text = await res.text();
                const data = JSON.parse(text.substring(text.indexOf("({") + 1, text.lastIndexOf("})") + 1));
                const rows = data.table.rows;
                let html = '';
                
                for(let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (!row || !row.c) continue; // Safety check
                    
                    const img = (row.c[0] && row.c[0].v) ? row.c[0].v : 'https://placehold.co/800/f8f9fa/109B74?text=Product';
                    const name = (row.c[1] && row.c[1].v) ? row.c[1].v : 'Product';
                    const desc = (row.c[2] && row.c[2].v) ? row.c[2].v : '';
                    const priceFormatted = (row.c[3] && row.c[3].v) ? row.c[3].v : '';
                    const safePrice = parseFloat(String(priceFormatted).replace(/[^0-9.-]+/g,"")) || 0;

                    html += `
                    <div class="product-card rounded-2xl p-4 flex flex-col reveal active">
                        <div class="img-wrapper rounded-xl mb-6">
                            <img src="${img}" alt="${name}">
                        </div>
                        <h3 class="font-display text-xl font-semibold mb-1">${name}</h3>
                        <p class="font-sans text-sm text-gray-500 mb-6 flex-1">${desc}</p>
                        <div class="mt-auto flex items-center justify-between pt-4 border-t border-gray-100">
                            <span class="font-sans font-semibold text-lg text-brand-teal">${priceFormatted}</span>
                            <button onclick="addToCart('${i}', '${name.replace(/'/g, "\\'")}', ${safePrice}, '${img}')" class="bg-gray-900 text-white text-xs font-bold uppercase tracking-wider px-4 py-2 rounded-full hover:bg-brand-green transition-colors">${translations[currentLang].btn_cart}</button>
                        </div>
                    </div>`;
                }
                container.innerHTML = html;
            } catch (e) { container.innerHTML = '<div class="col-span-full text-center text-red-400 py-10">Failed to load store inventory.</div>'; }
        }

        /* --- Cart Logic --- */
        let cart = [];
        function addToCart(id, name, price, img) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) existingItem.qty += 1;
            else cart.push({ id, name, price, img, qty: 1 });
            updateCartBadge(); renderCart(); showToast();
        }
        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartBadge(); renderCart();
        }
        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;
            if(totalItems > 0) { badge.classList.add('animate-bounce'); setTimeout(() => badge.classList.remove('animate-bounce'), 1000); }
        }
        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('cart-total-price');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = ''; cartItemsContainer.appendChild(emptyMsg); emptyMsg.style.display = 'block'; totalPriceEl.innerText = '$0.00'; return;
            }
            emptyMsg.style.display = 'none';
            let html = '', total = 0;
            cart.forEach(item => {
                total += item.price * item.qty;
                html += `
                <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <img src="${item.img}" class="w-16 h-16 rounded-lg object-cover mix-blend-multiply bg-white">
                    <div class="flex-1">
                        <h4 class="font-display font-semibold text-sm line-clamp-1">${item.name}</h4>
                        <div class="text-brand-green font-sans font-medium text-sm">$${item.price.toFixed(2)}</div>
                        <div class="text-xs text-gray-400 mt-1">Qty: ${item.qty}</div>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600 p-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                </div>`;
            });
            cartItemsContainer.innerHTML = html;
            totalPriceEl.innerText = `$${total.toFixed(2)}`;
        }
        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop = document.getElementById('cart-backdrop');
            if (drawer.classList.contains('cart-open')) { drawer.classList.remove('cart-open'); backdrop.style.opacity = '0'; setTimeout(() => backdrop.classList.add('hidden'), 300); } 
            else { drawer.classList.add('cart-open'); backdrop.classList.remove('hidden'); setTimeout(() => backdrop.style.opacity = '1', 10); }
        }
        function showToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        /* --- WebGL Background --- */
        window.addEventListener('load', () => {
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
            script.onload = init3DTechBackground;
            document.head.appendChild(script);
        });

        function init3DTechBackground() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0xf8fafc, 20, 80);
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const gridSize = 100, segments = 40;
            const geometry = new THREE.PlaneGeometry(gridSize, gridSize, segments, segments);
            geometry.rotateX(-Math.PI / 2);
            // Softer color for store background
            const material = new THREE.PointsMaterial({ color: 0x257EA6, size: 0.1, transparent: true, opacity: 0.4 });
            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            const positionAttribute = geometry.getAttribute('position');
            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (event) => { mouseX = (event.clientX - window.innerWidth / 2) * 0.05; mouseY = (event.clientY - window.innerHeight / 2) * 0.05; });
            window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime() * 0.5;
                const positions = geometry.getAttribute('position');
                for (let i = 0; i < positionAttribute.count; i++) {
                    const x = positions.getX(i), z = positions.getZ(i);
                    const wave = Math.sin(x * 0.1 + time) * 1.5 + Math.cos(z * 0.1 + time) * 1.5;
                    positions.setY(i, wave - 5);
                }
                positions.needsUpdate = true;
                camera.position.x += (mouseX - camera.position.x) * 0.05;
                camera.position.y += (15 + -mouseY - camera.position.y) * 0.05;
                camera.lookAt(0, 0, 0);
                particles.rotation.y = Math.sin(time * 0.05) * 0.1;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>

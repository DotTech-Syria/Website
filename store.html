<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotTech Store | Premium Gear</title>
    
    <!-- Next-Gen Typography (Inter & Outfit for EN, Tajawal for AR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@200;400;600;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#109B74',
                            teal: '#1B8A98',
                            blue: '#257EA6',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        arabic: ['Tajawal', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #0a0a0a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Language specific font overrides */
        html[dir="rtl"] body { font-family: 'Tajawal', sans-serif !important; }
        html[dir="rtl"] .font-display, html[dir="rtl"] .font-sans { font-family: 'Tajawal', sans-serif !important; }

        ::selection { background-color: rgba(16, 155, 116, 0.2); color: #109B74; }

        .text-gradient {
            background: linear-gradient(135deg, #109B74 0%, #257EA6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }

        #canvas-container {
            position: fixed; 
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1; pointer-events: none; opacity: 0.6;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s ease;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            border-color: rgba(16, 155, 116, 0.3);
        }
        .product-img-wrapper img { transition: transform 0.6s ease; }
        .product-card:hover .product-img-wrapper img { transform: scale(1.05); }

        /* Cart Drawer Animation */
        #cart-drawer { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .cart-open { transform: translateX(0) !important; }
        
        /* Toast Notification Animation */
        #toast-notification {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100px);
            opacity: 0;
        }
        #toast-notification.show {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <!-- Navigation -->
    <nav class="fixed w-full top-0 z-50 glass-nav transition-all duration-300">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 py-5 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3 group">
                <img src="./logo.png" alt="DotTech Logo" class="h-7 object-contain transition-transform group-hover:scale-105" onerror="this.outerHTML='<span class=\'font-display font-bold text-2xl tracking-tighter text-gradient\'>DotTech.</span>'">
            </a>
            
            <div class="hidden lg:flex items-center gap-8 font-sans text-sm font-medium tracking-wide">
                <a href="index.html" class="text-gray-900 hover:text-brand-green transition-colors" data-i18n="nav_home">Home</a>
                <a href="index.html#services" class="text-gray-900 hover:text-brand-green transition-colors" data-i18n="nav_expertise">Expertise</a>
                <a href="index.html#vision" class="text-gray-900 hover:text-brand-green transition-colors" data-i18n="nav_future">Future</a>
                <a href="index.html#contact" class="text-gray-900 hover:text-brand-green transition-colors" data-i18n="nav_contact">Initiate Contact</a>
            </div>

            <div class="flex items-center gap-6">
                <!-- Language Toggle -->
                <button onclick="toggleLanguage()" id="lang-toggle-btn" class="font-sans text-sm font-medium tracking-wide text-gray-900 hover:text-brand-green transition-colors">
                    AR
                </button>

                <!-- Cart Icon -->
                <button onclick="toggleCart()" class="relative text-gray-900 hover:text-brand-green transition-colors group">
                    <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                    <span id="cart-badge" class="absolute -top-1.5 -right-2 bg-brand-green text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">0</span>
                </button>

                <!-- User Auth -->
                <div class="relative pl-3 border-s border-gray-300" id="auth-wrapper">
                    <!-- Login Button -->
                    <button id="auth-login-btn" onclick="openAuthModal()" class="text-gray-900 hover:text-brand-green transition-all hover:scale-110 flex items-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </button>
                    <!-- User Avatar -->
                    <div id="user-profile-menu" class="hidden items-center cursor-pointer group" onclick="toggleUserDropdown()">
                        <img id="user-avatar" src="" alt="User" class="w-7 h-7 rounded-full border border-gray-200 object-cover hover:border-brand-green transition-colors shadow-sm">
                        <!-- Dropdown -->
                        <div id="user-dropdown" class="absolute rtl:left-0 ltr:right-0 top-full mt-3 w-36 bg-white rounded-xl shadow-xl py-2 hidden border border-gray-100 transition-all opacity-0">
                            <button onclick="window.authAPI.logout()" class="w-full text-left rtl:text-right px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-brand-green" data-i18n="auth_logout">Sign Out</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Store Hero -->
    <section class="pt-40 pb-12 relative z-10">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12">
            <h1 class="font-display text-5xl md:text-7xl font-semibold tracking-tighter mb-4" data-i18n="store_hero_title">Hardware & Gear.</h1>
            <p class="font-sans text-xl text-gray-500 font-light" data-i18n="store_hero_desc">Premium tech gear curated by DotTech experts. No gimmicks.</p>
        </div>
    </section>

    <!-- Category Filters -->
    <section class="pb-12 relative z-10 border-b border-gray-100">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 flex gap-4 overflow-x-auto pb-4 custom-scrollbar">
            <button class="px-6 py-2 rounded-full font-sans text-sm font-medium bg-gray-900 text-white transition-all whitespace-nowrap" data-i18n="filter_all">All Products</button>
            <button class="px-6 py-2 rounded-full font-sans text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-gray-900 transition-all whitespace-nowrap" data-i18n="filter_components">Components</button>
            <button class="px-6 py-2 rounded-full font-sans text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-gray-900 transition-all whitespace-nowrap" data-i18n="filter_peripherals">Peripherals</button>
            <button class="px-6 py-2 rounded-full font-sans text-sm font-medium bg-white text-gray-600 border border-gray-200 hover:border-gray-900 transition-all whitespace-nowrap" data-i18n="filter_accessories">Accessories</button>
        </div>
    </section>

    <!-- Product Grid -->
    <section class="py-20 relative z-10 min-h-[50vh]">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12">
            <!-- Dynamic Product Grid connected to Google Sheets -->
            <div id="dynamic-products" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
                <!-- Loading State -->
                <div class="col-span-full text-center py-20 text-gray-500 font-sans animate-pulse" id="products-loading">
                    Loading inventory from DotTech servers...
                </div>
            </div>
        </div>
    </section>

    <!-- Cart Drawer (Slide-in from right/left depending on RTL) -->
    <div id="cart-drawer" class="fixed top-0 bottom-0 ltr:right-0 rtl:left-0 w-full md:w-[400px] bg-white/95 backdrop-blur-xl shadow-2xl z-[100] transform ltr:translate-x-full rtl:-translate-x-full border-l border-gray-100 flex flex-col">
        <div class="p-6 flex items-center justify-between border-b border-gray-100">
            <h2 class="font-display text-2xl font-semibold" data-i18n="cart_title">Your Cart</h2>
            <button onclick="toggleCart()" class="p-2 hover:bg-gray-100 rounded-full transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 flex flex-col gap-6">
            <!-- Cart items will be injected here -->
            <div id="empty-cart-msg" class="text-center text-gray-500 font-sans mt-10" data-i18n="cart_empty">Your cart is currently empty.</div>
        </div>
        
        <div class="p-6 border-t border-gray-100 bg-gray-50/50">
            <div class="flex justify-between items-center mb-6">
                <span class="font-sans text-gray-500" data-i18n="cart_total">Total:</span>
                <span id="cart-total-price" class="font-display text-2xl font-semibold">$0.00</span>
            </div>
            <button class="w-full bg-brand-green text-white font-sans font-semibold py-4 rounded-xl hover:bg-[#0e8563] transition-colors shadow-lg shadow-brand-green/20" data-i18n="cart_checkout">
                Proceed to Checkout
            </button>
        </div>
    </div>
    
    <!-- Cart Backdrop -->
    <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-[90] hidden opacity-0 transition-opacity duration-300"></div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[110] bg-gray-900 text-white px-6 py-3 rounded-full font-sans text-sm flex items-center gap-3 shadow-2xl">
        <svg class="w-4 h-4 text-brand-green" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span id="toast-msg">Item added to cart</span>
    </div>

    <!-- Footer -->
    <footer class="bg-white/90 backdrop-blur-md pt-12 pb-12 border-t border-gray-100 relative z-10">
        <div class="max-w-screen-2xl mx-auto px-6 lg:px-12 flex flex-col md:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-2">
                <img src="./logo.png" alt="DotTech" class="h-5 object-contain grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition-all" onerror="this.style.display='none'">
                <span class="font-display font-semibold text-gray-900 tracking-tight">DotTech.</span>
            </div>
            <div class="font-sans text-sm text-gray-400" data-i18n="footer_rights">
                © 2026 DotTech. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 z-[100] hidden items-center justify-center opacity-0 transition-opacity duration-300 px-4">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm cursor-pointer" onclick="closeAuthModal()"></div>
        
        <!-- Modal Content Box -->
        <div class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col p-8 transform scale-95 transition-transform duration-300" id="auth-modal-content-box">
            <button onclick="closeAuthModal()" class="absolute top-6 right-6 z-10 w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition-all text-gray-800 rtl:right-auto rtl:left-6">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>

            <h3 class="font-display text-3xl font-semibold mb-6" data-i18n="auth_title">Welcome.</h3>
            
            <button onclick="window.authAPI.googleSignIn()" class="w-full flex items-center justify-center gap-3 border border-gray-300 rounded-xl py-3 hover:bg-gray-50 transition-colors mb-6 font-medium text-gray-700">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                <span data-i18n="auth_google">Continue with Google</span>
            </button>

            <div class="flex items-center gap-4 mb-6">
                <div class="flex-1 h-px bg-gray-200"></div>
                <span class="text-xs text-gray-400 uppercase font-bold tracking-widest" data-i18n="auth_or">Or</span>
                <div class="flex-1 h-px bg-gray-200"></div>
            </div>

            <input type="email" id="auth-email" placeholder="Email Address" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-brand-green focus:ring-1 focus:ring-brand-green transition-all font-sans">
            <input type="password" id="auth-password" placeholder="Password" class="w-full border border-gray-200 rounded-xl px-4 py-3 mb-6 focus:outline-none focus:border-brand-green focus:ring-1 focus:ring-brand-green transition-all font-sans">
            
            <div class="flex gap-4">
                <button onclick="window.authAPI.emailSignIn()" class="flex-1 bg-gray-900 text-white rounded-xl py-3 font-semibold hover:bg-brand-green transition-colors" data-i18n="auth_signin">Sign In</button>
                <button onclick="window.authAPI.emailSignUp()" class="flex-1 border border-gray-900 text-gray-900 rounded-xl py-3 font-semibold hover:bg-gray-50 transition-colors" data-i18n="auth_register">Register</button>
            </div>
            <p id="auth-error" class="text-red-500 text-sm mt-4 hidden text-center font-sans"></p>
        </div>
    </div>

    <script>
        /* ---------------------------------------------------
           INTERNATIONALIZATION (i18n) SYSTEM
        --------------------------------------------------- */
        const translations = {
            en: {
                nav_home: "Home", nav_expertise: "Expertise", nav_future: "Future", nav_contact: "Initiate Contact",
                store_hero_title: "Hardware & Gear.", store_hero_desc: "Premium tech gear curated by DotTech experts. No gimmicks.",
                filter_all: "All Products", filter_components: "Components", filter_peripherals: "Peripherals", filter_accessories: "Accessories",
                btn_cart: "Add to Cart",
                cart_title: "Your Cart", cart_empty: "Your cart is currently empty.", cart_total: "Total:", cart_checkout: "Proceed to Checkout",
                toast_added: "Item added to cart",
                footer_rights: "© 2026 DotTech. All rights reserved.",
                auth_title: "Welcome.", auth_google: "Continue with Google", auth_or: "Or", auth_signin: "Sign In", auth_register: "Register", auth_logout: "Sign Out"
            },
            ar: {
                nav_home: "الرئيسية", nav_expertise: "خبراتنا", nav_future: "المستقبل", nav_contact: "تواصل معنا",
                store_hero_title: "العتاد والملحقات.", store_hero_desc: "معدات تقنية متميزة مختارة من قبل خبراء دوت تك.",
                filter_all: "جميع المنتجات", filter_components: "قطع الحاسوب", filter_peripherals: "طرفيات", filter_accessories: "إكسسوارات",
                btn_cart: "أضف للسلة",
                cart_title: "سلة التسوق", cart_empty: "سلة التسوق فارغة حالياً.", cart_total: "المجموع:", cart_checkout: "إتمام الطلب",
                toast_added: "تمت إضافة المنتج للسلة",
                footer_rights: "© ٢٠٢٦ دوت تك. جميع الحقوق محفوظة.",
                auth_title: "أهلاً بك.", auth_google: "المتابعة باستخدام جوجل", auth_or: "أو", auth_signin: "تسجيل الدخول", auth_register: "حساب جديد", auth_logout: "تسجيل الخروج"
            }
        };

        let currentLang = localStorage.getItem('dottech_lang') || 'en';

        function applyLanguage(lang) {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            const btn = document.getElementById('lang-toggle-btn');
            if (btn) btn.textContent = lang === 'en' ? 'AR' : 'EN';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT') {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.innerHTML = translations[lang][key];
                    }
                }
            });
            renderCart(); // Re-render cart to update text direction
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            localStorage.setItem('dottech_lang', currentLang);
            applyLanguage(currentLang);
        }

        /* ---------------------------------------------------
           STORE & CART LOGIC
        --------------------------------------------------- */
        let cart = [];
        let allProducts = [];

        document.addEventListener("DOMContentLoaded", () => {
            applyLanguage(currentLang);
            fetchProducts();
        });

        async function fetchProducts() {
            const productsSheetId = '1onrTRPtJVMCVRTRI0zVm5lv_ra1PCZAnXHLpjFslMQs';
            try {
                const prodRes = await fetch(`https://docs.google.com/spreadsheets/d/${productsSheetId}/gviz/tq?tqx=out:json`);
                const prodText = await prodRes.text();
                const prodData = JSON.parse(prodText.substring(prodText.indexOf("({") + 1, prodText.lastIndexOf("})") + 1));
                
                const rows = prodData.table.rows;
                const startIndex = 1; // Skip header
                allProducts = [];
                
                for(let i = startIndex; i < rows.length; i++) {
                    const row = rows[i];
                    allProducts.push({
                        id: i,
                        img: (row.c && row.c[0] && row.c[0].v) ? row.c[0].v : 'https://placehold.co/800x800/f8f9fa/109B74?text=Product',
                        name: (row.c && row.c[1] && row.c[1].v) ? row.c[1].v : 'Unnamed Product',
                        desc: (row.c && row.c[2] && row.c[2].v) ? row.c[2].v : '',
                        priceRaw: (row.c && row.c[3] && row.c[3].v) ? row.c[3].v : 0,
                        priceFormatted: (row.c && row.c[3] && row.c[3].f) ? row.c[3].f : ((row.c && row.c[3] && row.c[3].v) ? `$${row.c[3].v}` : '$0.00')
                    });
                }
                renderProducts(allProducts);
            } catch (error) {
                console.error("Error loading products:", error);
                document.getElementById('products-loading').innerText = "Unable to load inventory. Ensure the Google Sheet is published to the web.";
            }
        }

        function renderProducts(products) {
            const container = document.getElementById('dynamic-products');
            if (products.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500 font-sans">No products found.</div>';
                return;
            }
            
            let html = '';
            products.forEach((prod, index) => {
                // Ensure price Raw is a number for the cart logic
                const safePrice = typeof prod.priceRaw === 'number' ? prod.priceRaw : parseFloat(String(prod.priceRaw).replace(/[^0-9.-]+/g,"")) || 0;
                
                html += `
                <div class="product-card rounded-2xl p-4 flex flex-col opacity-0 translate-y-10 transition-all duration-700" style="animation: fadeUp 0.6s forwards ${index * 0.1}s">
                    <div class="product-img-wrapper rounded-xl bg-gray-50 aspect-square mb-6">
                        <img src="${prod.img}" alt="${prod.name}" class="w-full h-full object-cover mix-blend-multiply" onerror="this.src='https://placehold.co/800x800/f8f9fa/109B74?text=No+Image'">
                    </div>
                    <h3 class="font-display text-xl font-semibold mb-1">${prod.name}</h3>
                    <p class="font-sans text-sm text-gray-400 mb-4">${prod.desc}</p>
                    <div class="mt-auto flex items-center justify-between">
                        <span class="font-sans font-medium text-lg text-brand-green">${prod.priceFormatted}</span>
                        <button onclick="addToCart('${prod.id}', '${prod.name.replace(/'/g, "\\'")}', ${safePrice}, '${prod.img}')" class="bg-gray-900 text-white text-xs font-bold uppercase tracking-wider px-4 py-2 rounded-full hover:bg-brand-green transition-colors" data-i18n="btn_cart">${translations[currentLang].btn_cart}</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // Simple inline animation keyframes
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(styleSheet);

        function addToCart(id, name, price, img) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ id, name, price, img, qty: 1 });
            }
            
            updateCartBadge();
            renderCart();
            showToast();
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartBadge();
            renderCart();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            badge.innerText = totalItems;
            if(totalItems > 0) {
                badge.classList.add('animate-bounce');
                setTimeout(() => badge.classList.remove('animate-bounce'), 1000);
            }
        }

        function renderCart() {
            const cartItemsContainer = document.getElementById('cart-items');
            const totalPriceEl = document.getElementById('cart-total-price');
            const emptyMsg = document.getElementById('empty-cart-msg');
            
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '';
                cartItemsContainer.appendChild(emptyMsg);
                emptyMsg.style.display = 'block';
                totalPriceEl.innerText = '$0.00';
                return;
            }
            
            emptyMsg.style.display = 'none';
            let html = '';
            let total = 0;
            
            cart.forEach(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                html += `
                <div class="flex gap-4 items-center bg-gray-50 p-3 rounded-xl">
                    <img src="${item.img}" class="w-16 h-16 rounded-lg object-cover mix-blend-multiply bg-white">
                    <div class="flex-1">
                        <h4 class="font-display font-semibold text-sm line-clamp-1">${item.name}</h4>
                        <div class="text-brand-green font-sans font-medium text-sm">$${item.price.toFixed(2)}</div>
                        <div class="text-xs text-gray-400">Qty: ${item.qty}</div>
                    </div>
                    <button onclick="removeFromCart('${item.id}')" class="text-red-400 hover:text-red-600 p-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    </button>
                </div>`;
            });
            
            cartItemsContainer.innerHTML = html;
            totalPriceEl.innerText = `$${total.toFixed(2)}`;
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop = document.getElementById('cart-backdrop');
            
            if (drawer.classList.contains('cart-open')) {
                drawer.classList.remove('cart-open');
                backdrop.style.opacity = '0';
                setTimeout(() => backdrop.classList.add('hidden'), 300);
            } else {
                drawer.classList.add('cart-open');
                backdrop.classList.remove('hidden');
                setTimeout(() => backdrop.style.opacity = '1', 10);
            }
        }

        function showToast() {
            const toast = document.getElementById('toast-notification');
            const msg = document.getElementById('toast-msg');
            msg.innerText = translations[currentLang].toast_added;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        /* ---------------------------------------------------
           MODAL LOGIC
        --------------------------------------------------- */
        function openAuthModal() {
            const modal = document.getElementById('auth-modal');
            document.getElementById('auth-error').classList.add('hidden');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.add('show');
                document.getElementById('auth-modal-content-box').style.transform = 'scale(1)';
                modal.style.opacity = '1';
                document.body.style.overflow = 'hidden';
            }, 10);
        }

        function closeAuthModal() {
            const modal = document.getElementById('auth-modal');
            document.getElementById('auth-modal-content-box').style.transform = 'scale(0.95)';
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.classList.remove('show');
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        function toggleUserDropdown() {
            const dropdown = document.getElementById('user-dropdown');
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                setTimeout(() => dropdown.style.opacity = '1', 10);
            } else {
                dropdown.style.opacity = '0';
                setTimeout(() => dropdown.classList.add('hidden'), 200);
            }
        }

        /* ---------------------------------------------------
           3D TECH GRID BACKGROUND (Simplified)
        --------------------------------------------------- */
        window.addEventListener("load", () => {
            const script = document.createElement('script');
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
            script.onload = init3DTechBackground;
            document.head.appendChild(script);
        });

        function init3DTechBackground() {
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0xffffff, 20, 80);
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const gridSize = 100;
            const segments = 40;
            const geometry = new THREE.PlaneGeometry(gridSize, gridSize, segments, segments);
            geometry.rotateX(-Math.PI / 2);

            const material = new THREE.PointsMaterial({
                color: 0x1B8A98,
                size: 0.15,
                transparent: true,
                opacity: 0.8
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            const positionAttribute = geometry.getAttribute('position');
            
            let mouseX = 0; let mouseY = 0;
            const windowHalfX = window.innerWidth / 2; const windowHalfY = window.innerHeight / 2;

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX) * 0.05;
                mouseY = (event.clientY - windowHalfY) * 0.05;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                const time = clock.getElapsedTime() * 0.5; // Slower wave for store page

                const positions = geometry.getAttribute('position');
                for (let i = 0; i < positionAttribute.count; i++) {
                    const x = positions.getX(i);
                    const z = positions.getZ(i);
                    const wave1 = Math.sin(x * 0.1 + time) * 1.0;
                    const wave2 = Math.cos(z * 0.1 + time) * 1.0;
                    positions.setY(i, wave1 + wave2 - 5);
                }
                positions.needsUpdate = true;

                camera.position.x += (mouseX - camera.position.x) * 0.05;
                camera.position.y += (15 + -mouseY - camera.position.y) * 0.05;
                camera.lookAt(0, 0, 0);

                particles.rotation.y = Math.sin(time * 0.05) * 0.1;
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>

            authDomain: "dottech-website.firebaseapp.com",
            projectId: "dottech-website",
            storageBucket: "dottech-website.firebasestorage.app",
            messagingSenderId: "1081481170332",
            appId: "1:1081481170332:web:189c741dd1b21250b48c59",
            measurementId: "G-FL0H9KDFJ2"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const showError = (error) => {
            const errEl = document.getElementById('auth-error');
            errEl.textContent = error.message.replace('Firebase: ', '');
            errEl.classList.remove('hidden');
        };

        window.authAPI = {
            googleSignIn: () => signInWithPopup(auth, provider).catch(showError),
            emailSignUp: () => {
                const e = document.getElementById('auth-email').value;
                const p = document.getElementById('auth-password').value;
                if(!e || !p) return showError({message:"Please enter email and password."});
                createUserWithEmailAndPassword(auth, e, p).catch(showError);
            },
            emailSignIn: () => {
                const e = document.getElementById('auth-email').value;
                const p = document.getElementById('auth-password').value;
                if(!e || !p) return showError({message:"Please enter email and password."});
                signInWithEmailAndPassword(auth, e, p).catch(showError);
            },
            logout: () => {
                signOut(auth).then(() => {
                    document.getElementById('user-dropdown').style.opacity = '0';
                    setTimeout(() => document.getElementById('user-dropdown').classList.add('hidden'), 200);
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            const loginBtn = document.getElementById('auth-login-btn');
            const profileMenu = document.getElementById('user-profile-menu');
            const avatar = document.getElementById('user-avatar');

            if (user) {
                loginBtn.classList.add('hidden');
                profileMenu.classList.remove('hidden');
                profileMenu.classList.add('flex');
                
                if (user.photoURL) {
                    avatar.src = user.photoURL;
                } else {
                    const initial = user.email ? user.email.charAt(0).toUpperCase() : 'U';
                    avatar.src = `https://placehold.co/100x100/109B74/ffffff?text=${initial}`;
                }
                
                if (!document.getElementById('auth-modal').classList.contains('hidden')) {
                    closeAuthModal();
                }
            } else {
                loginBtn.classList.remove('hidden');
                profileMenu.classList.add('hidden');
                profileMenu.classList.remove('flex');
            }
        });
    </script>
